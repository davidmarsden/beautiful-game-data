name: Publish Player Updates

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Release slot (YYYY-MM-DD). Leave blank to use today's UTC date."
        required: false
        default: ""
        type: string
      target:
        description: "Preferred release size; fewer are published when fewer eligible changes exist"
        required: true
        default: "30"
        type: string
      max:
        description: "Hard safety ceiling for one release"
        required: true
        default: "40"
        type: string
      includeStateChanges:
        description: "Also publish club/status/removal events (normally false for manager-facing Ratings Updates/New Players)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-player-updates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SLOT: ${{ github.event.inputs.slot || '' }}
      RELEASE_TARGET: ${{ github.event.inputs.target || '30' }}
      RELEASE_MAX: ${{ github.event.inputs.max || '40' }}
      INCLUDE_STATE_CHANGES: ${{ github.event.inputs.includeStateChanges || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify governed queue exists
        run: test -f derived/player-changes/player-change-queue.json

      - name: Publish deterministic rolling release
        run: |
          SLOT_ARG=""
          if [ -n "$RELEASE_SLOT" ]; then
            SLOT_ARG="--slot=$RELEASE_SLOT"
          fi
          npm run publish:player-updates -- \
            $SLOT_ARG \
            --target="$RELEASE_TARGET" \
            --max="$RELEASE_MAX" \
            --includeStateChanges="$INCLUDE_STATE_CHANGES"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tbg-player-updates-release
          path: |
            derived/player-changes/player-change-queue.json
            derived/player-changes/player-release-history.json
            derived/player-changes/player-release-latest.json
            derived/player-changes/player-release-summary.json
          if-no-files-found: error

      - name: Commit published release
        run: |
          if [ -z "$(git status --porcelain derived/player-changes)" ]; then
            echo "No player update release changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/player-changes
          git commit -m "Publish TBG player updates"
          git push

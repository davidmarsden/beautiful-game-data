name: Refresh Wider Transfermarkt Universe Monthly

on:
  schedule:
    # Monthly discovery/reconciliation pass. Run before the weekday refresh
    # window so the two publishing jobs do not normally overlap.
    - cron: "45 2 1 * *"
  workflow_dispatch:
    inputs:
      maxItems:
        description: "Maximum Apify items for the wider-competition refresh"
        required: false
        default: "10000"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-wide-transfermarkt-monthly
  cancel-in-progress: false

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  MAX_ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.maxItems || '10000' }}

jobs:
  refresh-wide-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Preserve pre-refresh player master
        run: cp data/transfermarkt/players-master.json calibration/players-master-before-wide-refresh.json

      - name: Scrape selected wider competitions
        run: |
          node scripts/fetch-apify-transfermarkt-values.js \
            --scope=wide \
            --includeGoldStandardRescue=false \
            --includeSearchQueries=false \
            --maxItems="$MAX_ITEMS" \
            --output=calibration/apify-transfermarkt-refresh-wide.json

      - name: Apply discovery policy
        run: |
          node scripts/filter-transfermarkt-refresh.js \
            --input=calibration/apify-transfermarkt-refresh-wide.json \
            --output=calibration/apify-transfermarkt-refresh-wide-accepted.json \
            --report=calibration/transfermarkt-refresh-wide-report.json \
            --zeroIds=calibration/transfermarkt-refresh-wide-zero-ids.json \
            --bridgeZeroValues=true

      - name: Merge wider-competition refresh into master
        run: |
          node scripts/import-transfermarkt-master.js \
            --input=calibration/apify-transfermarkt-refresh-wide-accepted.json \
            --mergeExisting=true

      - name: Restore true zero market values
        run: |
          node scripts/restore-zero-market-values.js \
            --zeroIds=calibration/transfermarkt-refresh-wide-zero-ids.json
          echo '[]' > calibration/empty-transfermarkt-refresh.json
          node scripts/import-transfermarkt-master.js \
            --input=calibration/empty-transfermarkt-refresh.json \
            --mergeExisting=true

      - name: Report newly discovered players
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const before = JSON.parse(await readFile('calibration/players-master-before-wide-refresh.json', 'utf8'));
          const after = JSON.parse(await readFile('data/transfermarkt/players-master.json', 'utf8'));
          const beforeIds = new Set(before.map(p => String(p.transfermarkt_id || p.player_id || '')));
          const newPlayers = after.filter(p => !beforeIds.has(String(p.transfermarkt_id || p.player_id || '')));
          const report = {
            generated_at: new Date().toISOString(),
            policy: 'data/config/transfermarkt-refresh-policy.json',
            mode: 'monthly_wider_competitions',
            before_players: before.length,
            after_players: after.length,
            newly_discovered_players: newPlayers.length,
            players: newPlayers.map(p => ({
              transfermarkt_id: p.transfermarkt_id,
              player_name: p.display_name,
              age: p.age,
              club: p.current_club,
              competition: p.current_competition_code,
              market_value_eur: p.market_value_eur,
              status: p.status
            }))
          };
          await writeFile('calibration/transfermarkt-refresh-wide-new-players.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ before: before.length, after: after.length, newly_discovered: newPlayers.length }, null, 2));
          NODE

      - name: Rebuild and publish TBG player database
        run: npm run rebuild:published-player-database

      - name: Upload refresh and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monthly-wide-transfermarkt-refresh
          path: |
            calibration/transfermarkt-refresh-wide*.json
            calibration/veteran-reality-check.json
            calibration/veteran-reality-check.md
            derived/player-database/**
            derived/player-changes/**
            derived/scouting-site/**
          if-no-files-found: warn

      - name: Commit refreshed data and published outputs
        run: |
          if [ -z "$(git status --porcelain data calibration derived)" ]; then
            echo "No refreshed or generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calibration derived
          git commit -m "Publish monthly wider Transfermarkt refresh"
          git push

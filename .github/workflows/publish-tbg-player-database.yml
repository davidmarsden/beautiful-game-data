name: Publish TBG Player Database

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tbg-player-database
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild published player database
        run: npm run rebuild:published-player-database

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tbg-player-database-release
          path: |
            derived/player-database/player-database.json
            derived/player-database/player-database.csv
            derived/player-database/player-database-summary.json
            derived/player-database/player-database-previous.json
            derived/player-database/player-database-previous-meta.json
            derived/player-changes/player-change-ledger.json
            derived/player-changes/player-change-ledger.md
            derived/initial-squads/initial-squad-summary.json
            derived/player-universe/player-universe-coverage-audit.json
            derived/player-universe/player-universe-coverage-audit.md
            derived/player-universe/league-player-coverage-audit.json
            derived/player-universe/league-player-coverage-audit.md
            derived/data-quality/data-quality-audit.json
            derived/data-quality/data-quality-audit.md
            calibration/veteran-reality-check.json
            calibration/veteran-reality-check.md
            derived/scouting-site/**
          if-no-files-found: warn

      - name: Commit generated database and site outputs
        run: |
          if [ -z "$(git status --porcelain derived calibration data/players data/game)" ]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived calibration data/players data/game
          git commit -m "Publish TBG player database"
          git push

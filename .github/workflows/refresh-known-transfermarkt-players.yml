name: Refresh Known Transfermarkt Players

on:
  schedule:
    # Weekday mixed refresh: priority known players plus a rotating discovery slice.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      edition:
        description: "Refresh edition: daily (500), weekend (1,500), or monthly (5,000 rotating known players)"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekend
          - monthly
      customLimit:
        description: "Optional override for number of known players (leave blank to use edition policy)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-known-transfermarkt-players
  cancel-in-progress: false

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  REFRESH_EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'daily' }}
  CUSTOM_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.customLimit || '' }}

jobs:
  refresh-known-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Preserve pre-refresh player master
        run: cp data/transfermarkt/players-master.json calibration/players-master-before-known-refresh.json

      - name: Quarantine known retired players
        run: node scripts/quarantine-retired-players.js

      - name: Build priority refresh batch
        id: batch
        run: |
          LIMIT_ARG=""
          if [ -n "$CUSTOM_LIMIT" ]; then
            LIMIT_ARG="--limit=$CUSTOM_LIMIT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$REFRESH_EDITION" = "daily" ]; then
            # Reserve part of the weekday Apify budget for new-player discovery.
            LIMIT_ARG="--limit=300"
          fi
          node scripts/export-priority-transfermarkt-refresh-batch.js \
            --mode="$REFRESH_EDITION" \
            $LIMIT_ARG \
            --output="calibration/transfermarkt-refresh-$REFRESH_EDITION-ids.json" \
            --report="calibration/transfermarkt-refresh-$REFRESH_EDITION-batch-report.json"
          COUNT=$(node -e "console.log(require('./calibration/transfermarkt-refresh-$REFRESH_EDITION-ids.json').length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Refresh priority known players only
        run: |
          node scripts/fetch-apify-transfermarkt-values.js \
            --scope=known \
            --playerIdsFile="calibration/transfermarkt-refresh-$REFRESH_EDITION-ids.json" \
            --includeGoldStandardRescue=false \
            --includeSearchQueries=false \
            --maxItems="${{ steps.batch.outputs.count }}" \
            --datasetLimit="${{ steps.batch.outputs.count }}" \
            --output="calibration/apify-transfermarkt-$REFRESH_EDITION-refresh.json"

      - name: Merge refreshed records into player master
        run: |
          node scripts/import-transfermarkt-master.js \
            --input="calibration/apify-transfermarkt-$REFRESH_EDITION-refresh.json" \
            --mergeExisting=true

      - name: Quarantine newly detected retired players
        run: node scripts/quarantine-retired-players.js

      - name: Report refresh coverage and changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const edition = process.env.REFRESH_EDITION;
          const before = JSON.parse(await readFile('calibration/players-master-before-known-refresh.json', 'utf8'));
          const after = JSON.parse(await readFile('data/transfermarkt/players-master.json', 'utf8'));
          const requested = JSON.parse(await readFile(`calibration/transfermarkt-refresh-${edition}-ids.json`, 'utf8'));
          const returned = JSON.parse(await readFile(`calibration/apify-transfermarkt-${edition}-refresh.json`, 'utf8'));
          const id = p => String(p.transfermarkt_id || p.player_id || '');
          const beforeById = new Map(before.map(p => [id(p), p]));
          const returnedIds = new Set(returned.map(id).filter(Boolean));
          const changes = [];
          for (const player of after) {
            const old = beforeById.get(id(player));
            if (!old) continue;
            const fields = {};
            for (const key of ['market_value_eur', 'current_club', 'current_competition_code', 'status', 'contract_expires']) {
              if (String(old[key] ?? '') !== String(player[key] ?? '')) fields[key] = { before: old[key] ?? null, after: player[key] ?? null };
            }
            if (Object.keys(fields).length) changes.push({ transfermarkt_id: id(player), player_name: player.display_name, fields });
          }
          const report = {
            generated_at: new Date().toISOString(),
            mode: `${edition}_priority_known_players`,
            requested_players: requested.length,
            returned_players: returned.length,
            missing_from_refresh: requested.filter(value => !returnedIds.has(String(value))).length,
            master_before: before.length,
            master_after: after.length,
            newly_added_players: after.filter(p => !beforeById.has(id(p))).length,
            changed_players: changes.length,
            changes
          };
          await writeFile(`calibration/${edition}-known-player-refresh-report.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ requested: report.requested_players, returned: report.returned_players, missing: report.missing_from_refresh, newly_added: report.newly_added_players, changed: report.changed_players }, null, 2));
          NODE

      - name: Verify known-player stage did not discover players
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const edition = process.env.REFRESH_EDITION;
          const report = JSON.parse(await readFile(`calibration/${edition}-known-player-refresh-report.json`, 'utf8'));
          if (report.newly_added_players !== 0) {
            console.error(`Priority known-player refresh unexpectedly added ${report.newly_added_players} player(s).`);
            process.exit(1);
          }
          NODE

      - name: Build rotating playable-club discovery slice
        if: ${{ env.REFRESH_EDITION == 'daily' }}
        id: discovery
        run: |
          node scripts/export-daily-transfermarkt-discovery-scope.js \
            --batchSize=10 \
            --output=calibration/daily-transfermarkt-discovery-scope.json

      - name: Scrape rotating playable-club discovery slice
        if: ${{ env.REFRESH_EDITION == 'daily' }}
        run: |
          node scripts/fetch-apify-transfermarkt-values.js \
            --scope=universe \
            --clubIds="${{ steps.discovery.outputs.club_ids }}" \
            --includeGoldStandardRescue=false \
            --includeSearchQueries=false \
            --maxItems=500 \
            --datasetLimit=500 \
            --output=calibration/apify-transfermarkt-daily-discovery.json

      - name: Apply discovery policy to daily slice
        if: ${{ env.REFRESH_EDITION == 'daily' }}
        run: |
          node scripts/filter-transfermarkt-refresh.js \
            --input=calibration/apify-transfermarkt-daily-discovery.json \
            --output=calibration/apify-transfermarkt-daily-discovery-accepted.json \
            --report=calibration/daily-transfermarkt-discovery-policy-report.json \
            --zeroIds=calibration/daily-transfermarkt-discovery-zero-ids.json \
            --bridgeZeroValues=true

      - name: Merge accepted daily discoveries into player master
        if: ${{ env.REFRESH_EDITION == 'daily' }}
        run: |
          node scripts/import-transfermarkt-master.js \
            --input=calibration/apify-transfermarkt-daily-discovery-accepted.json \
            --mergeExisting=true
          node scripts/restore-zero-market-values.js \
            --zeroIds=calibration/daily-transfermarkt-discovery-zero-ids.json

      - name: Report newly discovered daily players
        if: ${{ env.REFRESH_EDITION == 'daily' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const before = JSON.parse(await readFile('calibration/players-master-before-known-refresh.json', 'utf8'));
          const after = JSON.parse(await readFile('data/transfermarkt/players-master.json', 'utf8'));
          const scope = JSON.parse(await readFile('calibration/daily-transfermarkt-discovery-scope.json', 'utf8'));
          const id = p => String(p.transfermarkt_id || p.player_id || '');
          const beforeIds = new Set(before.map(p => id(p)));
          const newPlayers = after.filter(p => !beforeIds.has(id(p)));
          const report = {
            generated_at: new Date().toISOString(),
            mode: 'daily_rotating_playable_club_discovery',
            clubs_scanned: scope.clubs,
            newly_discovered_players: newPlayers.length,
            players: newPlayers.map(p => ({
              transfermarkt_id: p.transfermarkt_id,
              player_name: p.display_name,
              age: p.age,
              club: p.current_club,
              competition: p.current_competition_code,
              market_value_eur: p.market_value_eur,
              status: p.status
            }))
          };
          await writeFile('calibration/daily-transfermarkt-new-players-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ clubs_scanned: scope.clubs.length, newly_discovered_players: newPlayers.length }, null, 2));
          NODE

      - name: Rebuild and publish TBG player database
        run: npm run rebuild:published-player-database

      - name: Upload refresh and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REFRESH_EDITION }}-known-player-transfermarkt-refresh
          path: |
            calibration/transfermarkt-refresh-${{ env.REFRESH_EDITION }}-batch-report.json
            calibration/${{ env.REFRESH_EDITION }}-known-player-refresh-report.json
            calibration/daily-transfermarkt-discovery-*.json
            calibration/daily-transfermarkt-new-players-report.json
            calibration/retired-player-quarantine-report.json
            calibration/veteran-reality-check.json
            calibration/veteran-reality-check.md
            derived/player-database/**
            derived/player-changes/**
            derived/scouting-site/**
          if-no-files-found: warn

      - name: Commit refreshed data and published outputs
        run: |
          if [ -z "$(git status --porcelain data calibration derived)" ]; then
            echo "No refreshed or generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calibration derived
          git commit -m "Publish $REFRESH_EDITION Transfermarkt refresh"
          git push

name: Evaluate SMW Rating Model

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season starting year, e.g. 2025 for 2025/26"
        required: true
        default: "2025"
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      baseTargetsPath:
        description: "Base SoccerWiki ratings CSV"
        required: true
        default: "calibration/smw-ratings.csv"
      targetsPath:
        description: "Enriched SoccerWiki ratings CSV used for evaluation"
        required: true
        default: "calibration/smw-ratings-enriched.csv"
      marketValuesPath:
        description: "Optional Transfermarkt values CSV exported by worldfootballR"
        required: false
        default: "calibration/transfermarkt-values.csv"
      minModelRating:
        description: "Only enrich missing API players at or above this model rating"
        required: true
        default: "83"
      enrichmentLimit:
        description: "Maximum missing players to search during enrichment"
        required: true
        default: "120"
      output:
        description: "Output JSON report"
        required: true
        default: "calibration/smw-rating-evaluation.json"
      ridge:
        description: "Ridge regularisation value"
        required: true
        default: "1"
      calibrationRidge:
        description: "Calibration ridge regularisation value"
        required: true
        default: "0.5"
      minTrainingConfidence:
        description: "Minimum identity confidence for training/evaluation examples"
        required: true
        default: "0.95"
      excludeClubMismatches:
        description: "Exclude matches where API club and SoccerWiki club differ"
        required: true
        default: "false"
      commitResults:
        description: "Commit enriched CSV and evaluation reports back to repo"
        required: true
        default: "false"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Prepare enriched SoccerWiki ratings
        run: |
          PACK="exports/league-packs/league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          TARGETS="${{ github.event.inputs.targetsPath }}"
          BASE_TARGETS="${{ github.event.inputs.baseTargetsPath }}"
          if [ ! -f "$TARGETS" ]; then
            echo "Enriched ratings file not found: $TARGETS"
            echo "Generating from base ratings: $BASE_TARGETS"
            npm run enrich:soccerwiki:missing-ratings -- --pack="$PACK" --targets="$BASE_TARGETS" --output="$TARGETS" --minModelRating="${{ github.event.inputs.minModelRating }}" --limit="${{ github.event.inputs.enrichmentLimit }}" --report="calibration/smw-ratings-enrichment-report.json" --delayMs=250
          else
            echo "Using existing enriched ratings file: $TARGETS"
          fi

      - name: Evaluate SMW rating model
        run: |
          PACK="exports/league-packs/league-${{ github.event.inputs.league }}-season-${{ github.event.inputs.season }}.json"
          MARKET_VALUES="${{ github.event.inputs.marketValuesPath }}"
          EXTRA_ARGS=""
          if [ -f "$MARKET_VALUES" ]; then
            echo "Using Transfermarkt values: $MARKET_VALUES"
            EXTRA_ARGS="--marketValues=$MARKET_VALUES"
          else
            echo "Transfermarkt values not found: $MARKET_VALUES"
          fi
          npm run evaluate:smw-rating-model -- --pack="$PACK" --targets="${{ github.event.inputs.targetsPath }}" $EXTRA_ARGS --output="${{ github.event.inputs.output }}" --report="calibration/smw-rating-evaluation.md" --marketImpactOutput="calibration/smw-rating-evaluation-market-impact.json" --marketImpactReport="calibration/smw-rating-evaluation-market-impact.md" --ridge="${{ github.event.inputs.ridge }}" --calibrationRidge="${{ github.event.inputs.calibrationRidge }}" --minTrainingConfidence="${{ github.event.inputs.minTrainingConfidence }}" --excludeClubMismatches="${{ github.event.inputs.excludeClubMismatches }}"

      - name: Upload SMW rating evaluation
        uses: actions/upload-artifact@v4
        with:
          name: smw-rating-evaluation
          path: |
            ${{ github.event.inputs.targetsPath }}
            ${{ github.event.inputs.marketValuesPath }}
            calibration/smw-ratings-enrichment-report.json
            ${{ github.event.inputs.output }}
            calibration/smw-rating-evaluation.md
            calibration/smw-rating-evaluation-market-impact.json
            calibration/smw-rating-evaluation-market-impact.md

      - name: Commit SMW rating evaluation
        if: ${{ github.event.inputs.commitResults == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.targetsPath }}" "${{ github.event.inputs.marketValuesPath }}" calibration/smw-ratings-enrichment-report.json "${{ github.event.inputs.output }}" calibration/smw-rating-evaluation.md calibration/smw-rating-evaluation-market-impact.json calibration/smw-rating-evaluation-market-impact.md
          git commit -m "Evaluate SMW rating model" || echo "No changes to commit"
          git push

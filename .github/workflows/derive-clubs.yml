name: Derive Clubs

on:
  workflow_dispatch:
    inputs:
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      season:
        description: "Season year"
        required: true
        default: "2025"
      players:
        description: "Optional derived players snapshot path"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  derive-clubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Derive clubs
        run: |
          if [ -n "${{ github.event.inputs.players }}" ]; then
            npm run derive:clubs -- --league=${{ github.event.inputs.league }} --season=${{ github.event.inputs.season }} --players='${{ github.event.inputs.players }}'
          else
            npm run derive:clubs -- --league=${{ github.event.inputs.league }} --season=${{ github.event.inputs.season }}
          fi
      - name: Commit derived clubs
        run: |
          if [ -z "$(git status --porcelain derived/clubs)" ]; then
            echo "No derived club changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/clubs
          git commit -m "Derive clubs and manager slots"
          git push

name: Player Universe Coverage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit, registry-repair, canonical-league-repair, targeted-import, kees-smit-import, or rebuild"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - registry-repair
          - canonical-league-repair
          - targeted-import
          - kees-smit-import
          - rebuild
      playerIds:
        description: "Comma-separated Transfermarkt player IDs for targeted import"
        required: false
        type: string
      clubIds:
        description: "Comma-separated Transfermarkt club IDs for targeted import"
        required: false
        type: string
      searchQueries:
        description: "Comma-separated exact player search queries when an ID is not known"
        required: false
        type: string
      datasetId:
        description: "Optional existing Apify dataset ID to reuse without a new scrape"
        required: false
        type: string
      leagueKeys:
        description: "Optional canonical league keys to repair, comma-separated (for example bundesliga,serie_a)"
        required: false
        type: string
      includeThin:
        description: "Repair thin canonical clubs as well as completely missing clubs"
        required: false
        default: true
        type: boolean
      maxItems:
        description: "Optional maximum Apify items for canonical repair or targeted import"
        required: false
        type: string

permissions:
  contents: write

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run targeted import
        if: ${{ inputs.mode == 'targeted-import' }}
        run: |
          node scripts/import-transfermarkt-targeted.js \
            --playerIds="${{ inputs.playerIds }}" \
            --clubIds="${{ inputs.clubIds }}" \
            --searchQueries="${{ inputs.searchQueries }}" \
            --datasetId="${{ inputs.datasetId }}" \
            --maxItems="${{ inputs.maxItems }}"

      - name: Import Kees Smit
        if: ${{ inputs.mode == 'kees-smit-import' }}
        run: |
          node scripts/import-transfermarkt-targeted.js \
            --searchQueries="Kees Smit" \
            --maxItems=25

      - name: Repair canonical league coverage
        if: ${{ inputs.mode == 'canonical-league-repair' }}
        run: |
          npm run repair:canonical-league-coverage -- \
            --leagueKeys="${{ inputs.leagueKeys }}" \
            --includeThin="${{ inputs.includeThin }}" \
            --datasetId="${{ inputs.datasetId }}" \
            --maxItems="${{ inputs.maxItems }}"

      - name: Diagnose registry exclusions before rebuild
        if: ${{ inputs.mode == 'registry-repair' }}
        run: npm run diagnose:player-registry -- --phase=before

      - name: Build lightweight wider registry
        if: ${{ inputs.mode != 'canonical-league-repair' && inputs.mode != 'registry-repair' }}
        run: npm run build:wider-player-registry

      - name: Rebuild rated pools and published database
        if: ${{ inputs.mode == 'targeted-import' || inputs.mode == 'kees-smit-import' || inputs.mode == 'rebuild' || inputs.mode == 'registry-repair' }}
        run: npm run rebuild:published-player-database

      - name: Verify registry exclusions after rebuild
        if: ${{ inputs.mode == 'registry-repair' }}
        run: npm run diagnose:player-registry -- --phase=after --failOnMissing=true

      - name: Run player universe coverage audit
        if: ${{ inputs.mode == 'audit' }}
        run: npm run audit:player-universe

      - name: Run league coverage audit
        if: ${{ inputs.mode == 'audit' }}
        run: npm run audit:league-coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-universe-coverage
          path: |
            derived/player-universe/wider-player-registry-summary.json
            derived/player-universe/player-universe-coverage-audit.json
            derived/player-universe/player-universe-coverage-audit.md
            derived/player-universe/league-player-coverage-audit.json
            derived/player-universe/league-player-coverage-audit.md
            derived/player-universe/player-registry-diagnosis-before.json
            derived/player-universe/player-registry-diagnosis-before.md
            derived/player-universe/player-registry-diagnosis-after.json
            derived/player-universe/player-registry-diagnosis-after.md
            derived/player-universe/canonical-league-repair-plan.json
            derived/player-universe/canonical-league-repair-result.json
            derived/player-database/player-database-summary.json
            data/players/player-registry-summary.json
          if-no-files-found: warn

      - name: Commit generated coverage and database outputs
        run: |
          if [ -z "$(git status --porcelain derived data/players data/transfermarkt calibration)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived data/players data/transfermarkt calibration
          git commit -m "Update player universe and league coverage"
          git push

name: Derive Players

on:
  workflow_dispatch:
    inputs:
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      season:
        description: "Season year"
        required: true
        default: "2025"
      leagueTier:
        description: "League tier: S, A, B, C or D"
        required: true
        default: "S"
      snapshot:
        description: "Optional exact snapshot path or GitHub file URL"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Derive players
        run: |
          if [ -n "${{ github.event.inputs.snapshot }}" ]; then
            npm run derive:players -- --snapshot='${{ github.event.inputs.snapshot }}' --leagueTier=${{ github.event.inputs.leagueTier }}
          else
            npm run derive:players -- --league=${{ github.event.inputs.league }} --season=${{ github.event.inputs.season }} --leagueTier=${{ github.event.inputs.leagueTier }}
          fi
      - name: Commit derived players
        run: |
          if [ -z "$(git status --porcelain derived/players)" ]; then
            echo "No derived player changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/players
          git commit -m "Derive players from snapshot"
          git push

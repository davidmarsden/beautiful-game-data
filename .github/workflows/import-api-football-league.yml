name: Import Complete API-Football League

on:
  workflow_dispatch:
    inputs:
      league:
        description: "API-Football league id"
        required: true
        default: "39"
      season:
        description: "Season starting year, e.g. 2024 for 2024/25"
        required: true
        default: "2024"
      maxPages:
        description: "Maximum player pages, capped at 3 for free plans"
        required: true
        default: "3"
      includeCoaches:
        description: "Import coaches too? More API calls; leave false on free plan"
        required: true
        default: "false"
      requestDelayMs:
        description: "Delay between API requests in milliseconds"
        required: true
        default: "2500"

permissions:
  contents: write

jobs:
  import-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import league
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_REQUEST_DELAY_MS: ${{ github.event.inputs.requestDelayMs }}
        run: npm run import:api-football:league -- --league=${{ github.event.inputs.league }} --season=${{ github.event.inputs.season }} --maxPages=${{ github.event.inputs.maxPages }} --includeCoaches=${{ github.event.inputs.includeCoaches }}
      - name: Commit complete league snapshot
        run: |
          if [ -z "$(git status --porcelain providers/api-football)" ]; then
            echo "No provider data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/api-football
          git commit -m "Import complete API-Football league snapshot"
          git push

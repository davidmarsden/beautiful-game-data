name: Publish Pink Final Scouting Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/**
      - site/**
      - design-contract/**
      - derived/player-database/player-database.json
      - derived/player-changes/player-change-ledger.json
      - data/config/tbg-club-universe.json
      - scripts/build-scouting-site.js
      - scripts/promote-global-clubs-to-top80.js
      - scripts/verify-design-contract.js
      - .github/workflows/publish-scouting-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify governed TBG design contract
        run: npm run design-contract:verify

      - name: Apply canonical Top 80 club promotions
        run: node scripts/promote-global-clubs-to-top80.js

      - name: Verify required Pink Final data
        run: |
          test -f derived/player-database/player-database.json || { echo "Missing player database"; exit 1; }
          test -f derived/player-changes/player-change-ledger.json || { echo "Missing player change ledger. Run Publish TBG Player Database first."; exit 1; }
          test -f data/config/tbg-club-universe.json || { echo "Missing club universe"; exit 1; }

      - name: Build canonical Pink Final site
        run: npm run build:scouting-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: derived/scouting-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish Pink Final Scouting Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/**
      - derived/player-database/player-database.json
      - data/config/tbg-club-universe.json
      - .github/workflows/publish-scouting-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Pink Final data files
        run: |
          mkdir -p public/scouting public/clubs

          if [ ! -f derived/player-database/player-database.json ]; then
            echo "Missing derived/player-database/player-database.json"
            exit 1
          fi

          if [ ! -f data/config/tbg-club-universe.json ]; then
            echo "Missing data/config/tbg-club-universe.json"
            exit 1
          fi

          cp derived/player-database/player-database.json public/scouting/player-database.json
          cp data/config/tbg-club-universe.json public/clubs/club-universe.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
